name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check (+ inline CSS/JS sync verification)
        run: make check
      - name: CSV builder unit tests
        run: node tests/test_csv.mjs
